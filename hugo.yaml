baseURL: "https://jbwon.com/"
title: JB Won
paginate: 5
theme: PaperMod

services:
  googleAnalytics:
    ID: G-28TRX1QHRQ

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: JB Won
  description: "Towards full-dive VR. Learning notes on neuroscience & AI"
  keywords: [Blog, Portfolio, full-dive VR, VR, Neuroscience, AI, AR, sensory system]
  author: JB Won
  defaultTheme: auto
  disableThemeToggle: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-icon-180x180.png"

  mainSections: ["posts", "review"]
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  comments: false

  homeInfoParams:
    Title: "👋 Hi, this is JB Won"
    Content: "I'm a senior @ Seoul National University CS.\\\nRecently, I decided to dedicate the rest of my life to full-dive VR."

  socialIcons:
    - name: x
      url: "https://x.com/jbwon_"
    - name: github
      url: "https://github.com/enginism"
    - name: email
      url: "mailto:jim8697@snu.ac.kr"
    - name: rss
      url: "/index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: review
      name: Review
      url: /review/
      weight: 15
    # - identifier: subscribe
    #   name: Subscribe
    #   url: /subscribe/
    #   weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: ""
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false

pygmentsUseClasses: true