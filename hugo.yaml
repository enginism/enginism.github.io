baseURL: "https://jbwon.com/"
title: JB Won
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: JB Won
  description: "Towards full-dive VR, learning notes on neuroscience & AI"
  keywords: [Blog, Portfolio, full-dive VR, VR, Neuroscience, AI, AR, sensory system]
  author: JB Won
  defaultTheme: auto
  disableThemeToggle: false

  mainSections: ["posts", "review"]
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  comments: false

  homeInfoParams:
    Title: "👋 Hi, this is JB Won"
    Content: "I'm a senior @ Seoul National University CS.\\\nRecently, I decided to dedicate the rest of my life to full-dive VR."

  socialIcons:
    - name: x
      url: "https://x.com/jbwon_"
    - name: github
      url: "https://github.com/enginism"
    - name: email
      url: "mailto:jim8697@snu.ac.kr"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: review
      name: Review
      url: /review/
      weight: 15
    - identifier: subscribe
      name: Subscribe
      url: /subscribe/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false

pygmentsUseClasses: true